<title>Provisionamento de VPS, Checklist</title>
<style>
  :root{--navy:#1F2B45;--gold:#B8924A;--cream:#F2EDE5;--olive:#686F3C;--ink:#2a2f3a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--navy);color:var(--cream);padding:28px 22px}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .sub{opacity:.8;font-size:14px;margin-top:6px}
  .bar{height:10px;background:#0002;border-radius:6px;overflow:hidden;margin-top:16px}
  .bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  .pct{font-size:13px;margin-top:6px;color:var(--gold)}
  main{max-width:820px;margin:0 auto;padding:22px}
  section{background:#fff;border-radius:12px;margin:16px 0;padding:6px 18px 14px;box-shadow:0 2px 10px #0000000f}
  h2{font-size:15px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:8px}
  label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #0000000a;cursor:pointer;font-size:15px;line-height:1.4}
  label:last-child{border:0}
  input{width:20px;height:20px;margin-top:1px;accent-color:var(--olive);flex:none}
  input:checked+span{text-decoration:line-through;opacity:.55}
  .tag{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:4px;padding:2px 7px;margin-left:auto;flex:none}
  .tag.sec{background:var(--olive)}
  .reset{background:none;border:1px solid var(--gold);color:var(--navy);border-radius:8px;padding:8px 14px;cursor:pointer;margin-top:10px}
</style>
<header>
  <h1>Provisionamento de VPS</h1>
  <div class="sub" id="proj">Projeto: __PROJETO__</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pct" id="pct">0%</div>
</header>
<main id="app">
  <!-- Preencher os <section> conforme a curadoria. Modelo abaixo: -->
  <section>
    <h2>1. Antes de comprar (só se for do zero)</h2>
    <label><input type="checkbox"><span>Ativar 2FA na conta do provedor</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>Escolher tamanho pelo recomendador (RAM/CPU/disco)</span></label>
    <label><input type="checkbox"><span>Comprar VPS com Ubuntu 24.04 LTS + ativar snapshot do provedor</span></label>
    <label><input type="checkbox"><span>Gerar chave SSH no Windows</span></label>
    <label><input type="checkbox"><span>Apontar o domínio (registro A -> IP da VPS)</span></label>
  </section>
  <section>
    <h2>2. Base + Segurança (setup-vps.sh)</h2>
    <label><input type="checkbox"><span>Subir chave pública e criar apelido no .ssh\config</span></label>
    <label><input type="checkbox"><span>Rodar setup-vps.sh (swap, ufw, fail2ban, updates, logrotate, fuso)</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>Confirmar SSH só-chave (senha desligada)</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>gitleaks + age instalados (anti-vazamento + criptografia)</span><span class="tag sec">segurança</span></label>
  </section>
  <section>
    <h2>3. Stack</h2>
    <label><input type="checkbox"><span>Node + PM2 (startup no boot) + nginx + certbot</span></label>
    <label><input type="checkbox"><span>Criar PORTAS.md (registro de portas)</span></label>
  </section>
  <section>
    <h2>4. Projetos da clínica (isolados)</h2>
    <label><input type="checkbox"><span>Criar cada projeto com novo-projeto.sh (nunca aninhar)</span></label>
    <label><input type="checkbox"><span>Recriar .env do zero (600), nunca copiar segredo antigo</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>Emitir SSL: certbot --nginx -d dominio</span></label>
  </section>
  <section>
    <h2>5. Backup 3-2-1 e dado sensível</h2>
    <label><input type="checkbox"><span>backup-projeto.sh no cron (banco por sqlite .backup)</span></label>
    <label><input type="checkbox"><span>Backup cifrado (age) saindo para FORA da VPS</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>Código importante no GitHub privado (sem .env)</span></label>
    <label><input type="checkbox"><span>Teste de restauração (--verificar) feito</span><span class="tag sec">segurança</span></label>
    <label><input type="checkbox"><span>Destino real dos alertas do monitor (WhatsApp/e-mail)</span></label>
  </section>
  <section>
    <h2>6. Fechamento</h2>
    <label><input type="checkbox"><span>Runbook gerado (portas, domínios, onde-está-cada-segredo, como restaurar)</span></label>
  </section>
  <button class="reset" onclick="if(confirm('Limpar tudo?')){localStorage.removeItem(KEY);location.reload()}">Zerar progresso</button>
</main>
<script>
  const KEY="vps-checklist-__PROJETO__";
  const boxes=[...document.querySelectorAll('input')];
  const saved=JSON.parse(localStorage.getItem(KEY)||"[]");
  boxes.forEach((b,i)=>b.checked=!!saved[i]);
  function upd(){
    localStorage.setItem(KEY,JSON.stringify(boxes.map(b=>b.checked)));
    const n=boxes.filter(b=>b.checked).length,p=Math.round(n/boxes.length*100);
    fill.style.width=p+"%";pct.textContent=p+"% ("+n+"/"+boxes.length+")";
  }
  boxes.forEach(b=>b.addEventListener('change',upd));upd();
</script>
